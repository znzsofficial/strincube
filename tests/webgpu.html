<h1>WebGPU 地形验证</h1><p>种子 42 · 25 区块 · 固定池塘与天然植被 · 640×480，DPR 1 · 无阴影、后处理、模型。每次先绘制稳定 WebGL 对照，再绘制所选路径；图像为实际帧截图。</p>
